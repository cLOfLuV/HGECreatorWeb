# HGE Creator 사이트 설정 (Jekyll — GitHub Pages가 자동으로 읽습니다)
# 기존 페이지(index.html, en/, indie-rgb/)는 Jekyll이 손대지 않고 그대로 올립니다.
# HGE Universe 웹진만 이 설정을 씁니다.

title: HGE Creator
url: "https://hgecreator.com"
baseurl: ""
timezone: Asia/Seoul

markdown: kramdown
kramdown:
  input: GFM

collections:
  interviews:
    output: true
    permalink: /universe/:name/

defaults:
  - scope:
      path: ""
      type: interviews
    values:
      layout: interview

exclude:
  - README.md
